name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Package versions are pinned and updated by hand, so a known vulnerability in any direct or
      # transitive package fails the build. Fix it with a pinned upgrade in Directory.Packages.props.
      - name: Audit for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      # Unit, property and golden replay tests need no server. Integration tests start PostgreSQL 17 and the
      # Temporal CLI dev server through Testcontainers, host the API in-process, and kill real worker processes.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*Tests*;-OrderSaga.Benchmarks"
          filefilters: "-*/obj/*"

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced."
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: order-saga-temporal:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Verify the image runs as non-root
        run: |
          user=$(docker image inspect order-saga-temporal:ci --format '{{.Config.User}}')
          echo "user: ${user}"
          test -n "${user}" && test "${user}" != "0" && test "${user}" != "root"

  compose-demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The README promises `docker compose up` runs the whole demo with zero manual steps; this job keeps it true.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Eight scenarios end as expected with no broken consistency rule
        run: |
          code=$(docker wait order-saga-temporal-demo-1)
          docker compose logs --no-log-prefix demo | tee demo.log
          test "${code}" = "0"
          grep -q '"summary":true,"scenarios":8,"passed":8,"violations":0' demo.log
          grep -q '"scenario":"payment-captured-response-lost-then-outage","ok":true' demo.log

      - name: The API joins a re-sent order and rejects a reused id
        run: |
          body='{"order":{"orderId":"ci-1","storeId":"store-01","customerRef":"c-1","lines":[{"sku":"doner","name":"Doner","quantity":1,"unitPriceKurus":25000}]}}'
          h=(-H "X-Api-Key: api-dev-only" -H "Content-Type: application/json")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${h[@]}" -d "$body" http://127.0.0.1:58280/api/v1/orders)" = "202"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${h[@]}" -d "$body" http://127.0.0.1:58280/api/v1/orders)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${h[@]}" -d "${body/25000/26000}" http://127.0.0.1:58280/api/v1/orders)" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:58280/api/v1/orders/ci-1)" = "401"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
